name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, and audit all 8 targets
        env:
          JAVA_17_HOME: ${{ steps.java17.outputs.path }}
          JAVA_21_HOME: ${{ steps.java21.outputs.path }}
          JAVA_25_HOME: ${{ steps.java25.outputs.path }}
        run: python3 scripts/build-matrix.py
