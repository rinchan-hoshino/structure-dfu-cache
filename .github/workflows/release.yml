name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and audit all 8 targets
        env:
          JAVA_17_HOME: ${{ steps.java17.outputs.path }}
          JAVA_21_HOME: ${{ steps.java21.outputs.path }}
          JAVA_25_HOME: ${{ steps.java25.outputs.path }}
        run: python3 scripts/build-matrix.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/releases/*.jar
          body_path: CHANGELOG.md
