pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'structure-dfu-cache'
def loader = gradle.startParameter.projectProperties['loader'] ?: 'neoforge'
def profile = gradle.startParameter.projectProperties['profile'] ?: '1.21.1'
rootProject.buildFileName = loader == 'fabric' && profile.startsWith('26.') ?
    'profiles/fabric-modern.gradle' : "profiles/${loader}.gradle"
